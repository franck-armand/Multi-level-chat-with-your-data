name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Run all tests on schedule
  nightly-test:
    name: Nightly Test Suite
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        llm-provider: ['ollama', 'local']
    
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "curl -f http://localhost:11434/api/tags || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup UV
        uses: astral-sh/setup-uv@v8.1.0

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Wait for Ollama
        if: matrix.llm-provider == 'ollama'
        run: |
          sleep 10
          curl http://localhost:11434/api/tags
          curl -X POST http://localhost:11434/api/pull -d '{"name": "llama3.2"}' || true

      - name: Run full test suite
        env:
          LLM_PROVIDER: ${{ matrix.llm-provider }}
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          uv run pytest tests/ -v --tb=short -x
          uv run python test_e2e_full.py

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#ci-cd'
          text: 'Nightly tests failed on Python ${{ matrix.python-version }} with ${{ matrix.llm-provider }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
