name: CI/CD

on:
  push:
    branches: [main, master, nextLevel]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.10'
  UV_VERSION: '0.5.x'

jobs:
  # Job 1: Code Quality Checks
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup UV
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run type checks (if configured)
        run: |
          if [ -f pyproject.toml ] && grep -q "mypy\|pyright" pyproject.toml; then
            uv run mypy src/ || true
          fi
        continue-on-error: true

  # Job 2: Unit Tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup UV
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short --color=yes

      - name: Generate coverage report
        run: uv run pytest tests/ --cov=chatwithdocs --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 3: Integration Tests
  # Skipped on free runners — requires Ollama (~1.5GB image + model pull)
  # which exceeds GitHub free runner memory. Run locally with:
  # LLM_PROVIDER=ollama uv run python test_e2e_full.py
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    if: false

  # Job 4: Docker Build Test
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build Docker image
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          push: false
          tags: chatwithdocs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 5: CLI Tests
  cli-test:
    name: CLI Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup UV
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Test CLI commands
        run: |
          # Test help
          uv run chatwithdocs --help
          uv run chatwithdocs --version
          
          # Test config
          uv run chatwithdocs config --show
          
          # Test upload (with test file)
          echo "Test document content" > /tmp/test.txt
          uv run chatwithdocs upload /tmp/test.txt --user ci-test || true
          
          # Test list
          uv run chatwithdocs list || true

  # Job 6: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 7: Build and Push (only on main branch)
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, integration-test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/chatwithdocs
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.16.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 8: Create Release (on tags)
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, integration-test, build-and-push]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            LICENSE
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 9: Deploy to Staging (optional)
  # Uncomment and configure when ready to deploy to staging
  # Requires: GitHub Environment named "staging" + deployment secrets
  # deploy-staging:
  #   name: Deploy to Staging
  #   runs-on: ubuntu-latest
  #   needs: build-and-push
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   environment: staging
  #   
  #   steps:
  #     - name: Deploy to staging server
  #       run: |
  #         echo "Deploying to staging..."
  #         # Add your staging deployment commands here
  #         # Example: SSH into server and run docker-compose pull && docker-compose up -d
