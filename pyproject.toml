[project]
name = "edan-chat"
version = "0.1.0"
description = "Reproducible pipeline to extract, validate, and query the EDAN 2025 election results dataset."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Franck Kouassi"}]
license = {text = "MIT"}
dependencies = [
    "duckdb>=1.4.3",
    "langgraph>=1.0.6",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "streamlit>=1.52.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
edan = "edan.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
