[project]
name = "chatwithdocs"
version = "2.0.0"
description = "Enterprise RAG platform - Chat with your data using hybrid search and secure multi-user chat."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="Franck Kouassi"}]
license = {text = "MIT"}
dependencies = [
    # Core data processing
    "duckdb>=1.4.3",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "python-dotenv>=1.2.1",
    # Vector storage and embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    # LLM and AI
    "openai>=2.15.0",
    # API and web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Data validation and settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    # File processing
    "pdfplumber>=0.11.0",
    "marker-pdf>=1.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "watchdog>=6.0.0",
    "aiofiles>=24.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # Security and content filtering
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # UI
    "streamlit>=1.52.2",
    "matplotlib>=3.10.8",
    "aiohttp>=3.13.3",
    # Agent/Graph workflows
    "langgraph>=0.2.0",
    # Observability - Langfuse
    "langfuse>=2.0.0",
    "reportlab>=4.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
chatwithdocs = "chatwithdocs.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
