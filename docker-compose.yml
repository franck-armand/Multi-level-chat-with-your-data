# version: '3.8'

services:
  chatwithdocs:
    build: .
    ports:
      - "8501:8501"  # Streamlit UI
      - "8000:8000"  # FastAPI (optional)
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - DATA_DIR=/app/data
      - VECTOR_STORE_DIR=/app/data/vectors
      - CHAT_HISTORY_DB=/app/data/chat_history.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Ollama for local LLM
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    profiles:
      - ollama  # Only start when explicitly requested: docker-compose --profile ollama up

volumes:
  ollama_data:
